name: Volter workbench release

# Cuts one product's Code-OSS workbench for darwin-arm64, linux-x64 and win32-x64 with volter-ai/editor's
# scripts/workbench/build-release.mjs, and publishes each cut as a release of this repository: tag
# `<product>-<fork sha 12>-<editor sha 12>-<platform>`, assets the tarball and BUILD.json, BUILD.json as the notes.
# That is the release @volter/live's pinnedWorkbench fetches (packages/live/src/workbench-locator.ts in the editor).
# The fork commit is the one packages/editor-core/workbench/FORK.json pins at the editor revision, so a run's inputs
# name both sources. A release is built on its own platform (build-release packages the runner's native modules and
# node), so each platform has its own GitHub-hosted runner. The build jobs hold a read-only token. The publish jobs
# run once every platform has built, with build-release's `--publish --out`, which re-hashes the cut against its
# BUILD.json and refuses a tag that exists.

on:
  workflow_dispatch:
    inputs:
      editor_revision:
        description: volter-ai/editor commit SHA to build
        required: true
        type: string
      product:
        description: Product id (volter-ai/editor scripts/workbench/products)
        required: true
        default: cyclotron
        type: string

permissions:
  contents: read

env:
  EDITOR_REVISION: ${{ inputs.editor_revision }}
  PRODUCT: ${{ inputs.product }}
  # Git Bash on Windows rewrites a `<rev>:<path>` argument as a POSIX path list.
  MSYS_NO_PATHCONV: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            work: /mnt/wb
            min_ram: 15
          # Code-OSS's preinstall (build/npm/preinstall.ts) accepts Visual Studio 2022 or 2019; windows-latest
          # carries Visual Studio 2026 alone.
          - platform: win32-x64
            runner: windows-2022
            work: D:/wb
            min_ram: 15
          - platform: darwin-arm64
            runner: macos-15
            work: /Users/runner/wb
            min_ram: 7
    runs-on: ${{ matrix.runner }}
    steps:
      # Long paths for the fork's deepest files on Windows, and the bytes git holds in both trees on every platform.
      - name: Set git's long paths and LF endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Fetch the editor at the revision
        uses: actions/checkout@v4
        with:
          repository: volter-ai/editor
          ssh-key: ${{ secrets.CODE_OSS_EDITOR_DEPLOY_KEY }}
          ref: ${{ inputs.editor_revision }}
          path: editor
          persist-credentials: false

      - name: Read the fork pin
        id: pin
        run: echo "commit=$(jq -er .commit editor/packages/editor-core/workbench/FORK.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch the fork at the pin
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.commit }}
          path: code-oss
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc

      # node-gyp's Python for the fork's native modules.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      # The fork's native modules' headers; the work goes on /mnt, which has the room the root disk lacks, with 8 GB
      # more swap beside the 16 GB runner's RAM for the out-build emit's 9 GB node heap.
      - name: Prepare the Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libkrb5-dev
          sudo mkdir -p /mnt/wb && sudo chown "$USER" /mnt/wb
          sudo fallocate -l 8G /mnt/wb-swap && sudo chmod 600 /mnt/wb-swap
          sudo mkswap /mnt/wb-swap && sudo swapon /mnt/wb-swap

      # Windows does not overcommit: a 10 GB page file raises the 16 GB runner's commit limit for the 9 GB node heap.
      # It goes on C:, as D: holds the image's own page file and a volume holds one.
      - name: Add a page file
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 10GB
          disk-root: 'C:'

      - name: Install the editor
        working-directory: editor
        run: npm ci --ignore-scripts

      - name: Cut the release
        working-directory: editor
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
          # @vscode/ripgrep's install script sends GITHUB_TOKEN when it asks GitHub's API for its binary
          # (@vscode/ripgrep 1.17.1 lib/postinstall.js:107, lib/download.js:156); unauthenticated, a hosted runner's
          # shared address is refused (403) once its hourly allowance is spent.
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/workbench/build-release.mjs --product "$PRODUCT" --platform ${{ matrix.platform }}
          --checkout "$GITHUB_WORKSPACE/code-oss" --work ${{ matrix.work }}/work --out ${{ matrix.work }}/out
          --min-ram ${{ matrix.min_ram }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ matrix.work }}/out/BUILD.json
            ${{ matrix.work }}/out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    strategy:
      matrix:
        platform: [darwin-arm64, linux-x64, win32-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the editor at the revision
        uses: actions/checkout@v4
        with:
          repository: volter-ai/editor
          ssh-key: ${{ secrets.CODE_OSS_EDITOR_DEPLOY_KEY }}
          ref: ${{ inputs.editor_revision }}
          path: editor
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node editor/scripts/workbench/build-release.mjs --publish --out release
