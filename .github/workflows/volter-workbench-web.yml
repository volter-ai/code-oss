name: Volter workbench cut (web)

# Cuts one Volter product's WEB workbench on a GitHub-hosted runner: the static `vscode-web` package a limited view
# ships (volter-ai/editor docs/LIMITED-VIEW.md), the same bytes `scripts/workbench/build-release.mjs --target web`
# in volter-ai/editor cuts on a workstation. It is one package for every platform, so there is one workflow and no
# platform input.
#
# It builds at an editor revision that is on volter-ai/editor's main and at the fork commit that revision pins
# (`packages/editor-core/workbench/FORK.json`), so a run names both of its sources.
#
# NOTHING IS PUBLISHED. build-release refuses `--publish` for the web target: no product declares a web release, so
# there is no tag a product would read. The cut leaves as a workflow ARTIFACT instead: the tarball and its
# BUILD.json, which records the tarball's SHA256. Whoever builds a view cites the run id and the artifact's name,
# downloads it, checks the hash, unpacks it, and names the `vscode-web` directory as `view build --workbench`.
#
# The job's token is read-only and the workflow holds no secret: it runs thousands of dependency install scripts.
# It runs only when dispatched and gates nothing.

on:
  workflow_dispatch:
    inputs:
      editor_revision:
        description: Full volter-ai/editor commit SHA to build (must be on main)
        required: true
        type: string
      product:
        description: Product id (scripts/workbench/products)
        required: true
        default: cyclotron
        type: string

permissions:
  contents: read

concurrency:
  group: volter-workbench-web-${{ inputs.product }}-${{ inputs.editor_revision }}
  cancel-in-progress: false

env:
  EDITOR_REVISION: ${{ inputs.editor_revision }}
  PRODUCT: ${{ inputs.product }}
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        run: |
          [[ "$EDITOR_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::editor_revision must be a full 40-character commit SHA"; exit 1; }
          [[ "$PRODUCT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::product must be a product id"; exit 1; }
          # The artifact's name: the product and the editor revision's first twelve characters.
          echo "ARTIFACT_REVISION=${EDITOR_REVISION:0:12}" >> "$GITHUB_ENV"

      - name: Check out the editor
        uses: actions/checkout@v4
        with:
          repository: volter-ai/editor
          ref: ${{ inputs.editor_revision }}
          path: editor
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Refuse a revision that is not on the editor's main
        working-directory: editor
        run: |
          git merge-base --is-ancestor "$EDITOR_REVISION" origin/main || { echo "::error::$EDITOR_REVISION is not on volter-ai/editor main"; exit 1; }

      # The pin is read as data from git, never require()d from the tree: a FORK.json committed as a symlink to a
      # script would otherwise run as code. A symlink's blob is its target path, which fails the parse.
      - name: Read the fork pin
        id: pin
        run: |
          commit=$(git -C editor cat-file blob "$EDITOR_REVISION:packages/editor-core/workbench/FORK.json" \
            | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).commit)')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::packages/editor-core/workbench/FORK.json at $EDITOR_REVISION pins no full commit SHA"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out the fork at the pin
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.commit }}
          path: code-oss
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc

      # The web package itself carries no native module, but the fork's own `npm ci` builds the ones its
      # workspace declares before any target is chosen.
      - name: Install the fork's native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libkrb5-dev

      - name: Make room (work on /mnt, 8 GB more swap)
        run: |
          sudo mkdir -p /mnt/wb && sudo chown "$USER" /mnt/wb
          free_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          echo "/mnt has ${free_gb} GB free"
          (( free_gb >= 20 )) || { echo "::error::/mnt has ${free_gb} GB free; the cut wants about 20 (8 swap plus clone, node_modules and package with room)"; exit 1; }
          sudo fallocate -l 8G /mnt/wb-swap && sudo chmod 600 /mnt/wb-swap && sudo mkswap /mnt/wb-swap && sudo swapon /mnt/wb-swap
          free -g; df -h / /mnt

      # The web target carries no supercode chat (its Chat is the view's own built-in extension, from the editor's
      # source), so there is no frontend build to pin here as the platform workflows do.
      - name: Install the editor
        working-directory: editor
        run: npm ci --ignore-scripts

      # The fork's `npm ci` runs @vscode/ripgrep's install script, which asks GitHub's API for a release with no
      # token. From a hosted runner's shared address that is refused (403) once the address's unauthenticated
      # allowance is spent: the web workflow's run 37739234723 failed on it. The install script looks for the
      # download in a cache before it asks (lib/download.js, "Using cached download"), so this step puts the binary
      # there. It holds the read-only token in its own env and runs no dependency: the package is read as data (its
      # registry tarball, unpacked, nothing run), and the install scripts still get no token.
      - name: Fetch ripgrep's prebuilt binary to where the fork's install looks for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # What the install script asks for on this runner, and where it keeps a download: node's own tmpdir, as
          # the install script reads it, spelled with forward slashes.
          case "$(node -p 'process.platform + "-" + process.arch')" in
            linux-x64) target=x86_64-unknown-linux-musl; extension=tar.gz ;;
            win32-x64) target=x86_64-pc-windows-msvc; extension=zip ;;
            *) echo "::error::no ripgrep target is written down for this runner"; exit 1 ;;
          esac
          tmp=$(node -p 'require("os").tmpdir().split("\\").join("/")')
          # Every @vscode/ripgrep version any lockfile of the fork installs, one to a line. Read into a variable, so
          # that a read that FAILS stops the step: "the lockfiles could not be read" must never pass for "no
          # lockfile installs it", which would skip the fetch and leave the cut to fail on the API as before.
          lockfiles=$(git -C code-oss ls-files -- '*package-lock.json' | wc -l | tr -d ' ') || { echo "::error::could not list the fork's lockfiles"; exit 1; }
          (( lockfiles > 0 )) || { echo "::error::the fork checkout has no package-lock.json: this is not the tree the cut installs"; exit 1; }
          found=$(git -C code-oss ls-files -z -- '*package-lock.json' | (cd code-oss && xargs -0 node -e '
            const fs = require("fs");
            const seen = new Set();
            const isMap = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            // The older lockfile shape: a tree of `dependencies`, each named by its package.
            const walk = (dependencies) => {
              for (const [name, entry] of Object.entries(dependencies)) {
                if (!isMap(entry)) continue;
                if (name === "@vscode/ripgrep" && typeof entry.version === "string") seen.add(entry.version);
                if (isMap(entry.dependencies)) walk(entry.dependencies);
              }
            };
            for (const file of process.argv.slice(1)) {
              const lock = JSON.parse(fs.readFileSync(file, "utf8"));
              // A lockfile in neither shape is one this cannot read, which must not pass for "installs none".
              if (!isMap(lock.packages) && !isMap(lock.dependencies)) throw new Error(file + " has neither a packages nor a dependencies map");
              for (const [name, entry] of Object.entries(isMap(lock.packages) ? lock.packages : {})) {
                if (name.endsWith("node_modules/@vscode/ripgrep") && isMap(entry) && typeof entry.version === "string") seen.add(entry.version);
              }
              if (isMap(lock.dependencies)) walk(lock.dependencies);
            }
            for (const version of seen) console.log(version);
          ') | tr -d '\r') || { echo "::error::could not read the fork's lockfiles for the @vscode/ripgrep versions they install"; exit 1; }
          if [[ -z "$found" ]]; then echo "none of the fork's $lockfiles lockfiles installs @vscode/ripgrep: nothing to fetch"; exit 0; fi
          mapfile -t versions <<< "$found"
          for version in "${versions[@]}"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected @vscode/ripgrep version $version in a lockfile"; exit 1; }
            unpacked=$(mktemp -d)
            (cd "$unpacked" && npm pack "@vscode/ripgrep@$version" --ignore-scripts --silent > /dev/null && tar -xzf ./*.tgz)
            release=$(grep -oE "^const VERSION = '[^']+'" "$unpacked/package/lib/postinstall.js" | cut -d"'" -f2)
            [[ "$release" =~ ^v[0-9][0-9A-Za-z.-]*$ ]] || { echo "::error::could not read which ripgrep release @vscode/ripgrep@$version installs"; exit 1; }
            asset="ripgrep-$release-$target.$extension"
            cache="$tmp/vscode-ripgrep-cache-$version"
            mkdir -p "$cache"
            gh release download "$release" --repo microsoft/ripgrep-prebuilt --pattern "$asset" --dir "$cache" --clobber
            [[ -s "$cache/$asset" ]] || { echo "::error::$asset of microsoft/ripgrep-prebuilt $release was not downloaded"; exit 1; }
            # The binary is packaged into a published cut, so the bytes are checked against the digest the release
            # itself lists for the asset. An asset with no listed digest is refused, not trusted.
            listed=$(gh api "repos/microsoft/ripgrep-prebuilt/releases/tags/$release" --jq ".assets[] | select(.name == \"$asset\") | .digest") \
              || { echo "::error::could not read the digest microsoft/ripgrep-prebuilt $release lists for $asset"; exit 1; }
            [[ "$listed" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::microsoft/ripgrep-prebuilt $release lists no SHA256 digest for $asset"; exit 1; }
            got=$(sha256sum "$cache/$asset" | cut -d' ' -f1)
            [[ "sha256:$got" == "$listed" ]] || { rm -f "$cache/$asset"; echo "::error::$asset is $got, but the release lists ${listed#sha256:}"; exit 1; }
            echo "ripgrep $release for @vscode/ripgrep@$version: $cache/$asset ($listed)"
          done

      - name: Cut the web workbench
        working-directory: editor
        run: |
          node scripts/workbench/build-release.mjs --target web --product "$PRODUCT" \
            --checkout "$GITHUB_WORKSPACE/code-oss" --work /mnt/wb/work --out /mnt/wb/out --min-ram 15

      # The cut is read as data: every entry a regular file, and BUILD.json naming what was asked for.
      - name: Check the cut names what was asked for
        env:
          FORK_PIN: ${{ steps.pin.outputs.commit }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const out = '/mnt/wb/out';
          const record = JSON.parse(fs.readFileSync(`${out}/BUILD.json`, 'utf8'));
          const wrong = [
            ['target', record.target, 'vscode-web'],
            ['platform', record.platform, 'web'],
            ['product', record.product, process.env.PRODUCT],
            ['editorSource.revision', record.editorSource?.revision, process.env.EDITOR_REVISION],
            ['commit', record.commit, process.env.FORK_PIN],
            // As build-release's own publish path requires: the editor tree the cut was made from had no change
            // the revision does not name.
            ['editorSource.dirty', record.editorSource?.dirty, false],
          ].filter(([, got, want]) => got !== want);
          if (typeof record.tarball !== 'string' || !/^\w[\w.-]*\.tar\.gz$/.test(record.tarball)) wrong.push(['tarball', record.tarball, 'a bare .tar.gz name']);
          else if (!fs.lstatSync(`${out}/${record.tarball}`).isFile()) wrong.push(['tarball', record.tarball, 'a regular file']);
          else {
            const sha = crypto.createHash('sha256').update(fs.readFileSync(`${out}/${record.tarball}`)).digest('hex');
            if (sha !== record.tarballSha256) wrong.push(['tarballSha256', record.tarballSha256, sha]);
          }
          for (const [key, got, want] of wrong) console.log(`::error::BUILD.json ${key} is ${JSON.stringify(got)}, expected ${want}`);
          process.exit(wrong.length ? 1 : 0);
          EOF

      # The one fact this workflow exists to deliver: the Chat a view ships is the editor revision's own. The
      # extension is plain JavaScript that the build copies as it is, so the file in the tarball must be the file in
      # the editor checkout, byte for byte. Exactly one such file must be in the tarball.
      - name: Check the tarball carries this revision's view Chat
        run: |
          # Each hash is the end of a pipe. Without pipefail a failed read would hash nothing, and two failures
          # would compare equal: so a failed pipe fails the step, and the hash of nothing is refused by name.
          set -o pipefail
          nothing=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          tarball=$(ls /mnt/wb/out/*.tar.gz)
          # The wanted bytes are read from git at the revision, as the fork pin is, not from the working file, which
          # the build ran beside.
          want=$(git -C editor cat-file blob "$EDITOR_REVISION:packages/editor-core/view/workbench/extensions/volter-view-chat/extension.js" | sha256sum | cut -d' ' -f1)
          mapfile -t found < <(tar -tzf "$tarball" | grep -E '(^|/)extensions/volter-view-chat/extension\.js$' || true)
          (( ${#found[@]} == 1 )) || { echo "::error::the tarball holds ${#found[@]} files named extensions/volter-view-chat/extension.js, expected exactly one"; exit 1; }
          got=$(tar -xzOf "$tarball" -- "${found[0]}" | sha256sum | cut -d' ' -f1)
          [[ "$want" =~ ^[0-9a-f]{64}$ && "$want" != "$nothing" ]] || { echo "::error::the editor's volter-view-chat extension.js at $EDITOR_REVISION could not be read from git, or is empty"; exit 1; }
          [[ "$got" =~ ^[0-9a-f]{64}$ && "$got" != "$nothing" ]] || { echo "::error::${found[0]} could not be read from the tarball, or is empty"; exit 1; }
          echo "volter-view-chat extension.js: ${found[0]} $got (editor revision $want)"
          [[ "$got" == "$want" ]] || { echo "::error::${found[0]} in the tarball is $got, but the editor checkout's extension.js at $EDITOR_REVISION is $want"; exit 1; }
          echo "VIEW_CHAT_SHA256=$got" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "### $PRODUCT web workbench at editor $EDITOR_REVISION"
            if [[ -f /mnt/wb/out/BUILD.json ]]; then
              echo "Artifact: \`workbench-web-$PRODUCT-${EDITOR_REVISION:0:12}\` of run $GITHUB_RUN_ID"
              echo "Tarball SHA256: \`$(node -p 'JSON.parse(require("fs").readFileSync("/mnt/wb/out/BUILD.json", "utf8")).tarballSha256')\`"
              # BUILD.json's chatExtension version is the extension's fixed manifest version: it does not tell two
              # cuts apart. The editor revision does, and this hash of the file itself.
              echo "View Chat (volter-view-chat extension.js) SHA256: \`${VIEW_CHAT_SHA256:-not checked}\`; its version in BUILD.json is fixed, so the editor revision and this hash are what tell two cuts apart"
              echo
              echo "Use it:"
              echo '```sh'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name workbench-web-$PRODUCT-${EDITOR_REVISION:0:12} --dir workbench-web"
              echo '(cd workbench-web && tar -xzf *.tar.gz)   # check the tarball against BUILD.json tarballSha256 first'
              echo "cyclotron view build <project> --out <dir> --workbench workbench-web/vscode-web"
              echo '```'
              echo '```json'; cat /mnt/wb/out/BUILD.json; echo '```'
            else
              echo "No BUILD.json: the workbench was not cut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The tarball, not the unpacked directory: one file whose hash BUILD.json records, where an artifact of
      # thousands of loose files would be re-zipped by the runner with nothing to check it against.
      - name: Keep the cut as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-web-${{ inputs.product }}-${{ env.ARTIFACT_REVISION }}
          path: |
            /mnt/wb/out/BUILD.json
            /mnt/wb/out/*.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
