name: Volter workbench artifact (darwin-arm64)

# Source prerequisite t_bbe841eb for t_de1c2b37 / t_c92f341b, Articles 1/5/8/9.
# Run the editor's existing native vendor build at its exact fork pin. The
# editor revision must be on main or the exact head of its named in-repo PR,
# preserving the Windows/Linux workflows' source selection and token rules.
# This door has no publish job or write permission: only BUILD.json and its
# archive are retained for seven days. It changes no release or product pin.
#
# macos-15-xlarge is GitHub's hosted Apple Silicon runner with 14 GB RAM;
# --min-ram 13 accounts for the reported GiB while retaining the existing
# 9216 MiB Node heap and serial vendor build. Disk is checked before install:
# the disposable hosted image's unused Android SDK is removed, then the cut's
# 17 GiB of free space is required. The native Xcode toolchain is preserved.
# Native tool/space refusal is retained as a failed build, never an artifact.
# The runner requires the organisation's existing larger-runner access; this
# workflow does not enrol a machine or change runner/billing configuration.
# Runner specifications: https://docs.github.com/en/actions/reference/runners/larger-runners
# No tests, browser, proof, local long build or publication are part of this door.

on:
  workflow_dispatch:
    inputs:
      editor_revision:
        description: Full volter-ai/editor commit SHA to build (must be on main, or the head of editor_pull_request)
        required: true
        type: string
      editor_pull_request:
        description: Optional open volter-ai/editor PR number whose head is editor_revision (builds an unmerged head)
        required: false
        type: string
      product:
        description: Product id accepted by the editor's scripts/workbench/overlay.mjs
        required: true
        default: cyclotron
        type: string
      frontend_sha256:
        description: Optional SHA256 the installed @volter/supercode-frontend-vscode dist/extension.js must have
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: volter-workbench-darwin-${{ inputs.product }}-${{ inputs.editor_revision }}
  cancel-in-progress: false

env:
  EDITOR_REVISION: ${{ inputs.editor_revision }}
  EDITOR_PULL_REQUEST: ${{ inputs.editor_pull_request }}
  PRODUCT: ${{ inputs.product }}
  FRONTEND_SHA256: ${{ inputs.frontend_sha256 }}
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  build:
    runs-on: macos-15-xlarge
    timeout-minutes: 240
    env:
      WORKBENCH_ROOT: ${{ runner.temp }}/volter-workbench
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        run: |
          [[ "$EDITOR_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::editor_revision must be a full 40-character commit SHA"; exit 1; }
          [[ -z "$EDITOR_PULL_REQUEST" || "$EDITOR_PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo "::error::editor_pull_request must be a pull request number"; exit 1; }
          [[ "$PRODUCT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::product must be a product id"; exit 1; }
          [[ -z "$FRONTEND_SHA256" || "$FRONTEND_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::frontend_sha256 must be a SHA256"; exit 1; }

      - name: Check out the editor
        uses: actions/checkout@v4
        with:
          repository: volter-ai/editor
          ref: ${{ inputs.editor_revision }}
          path: editor
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Refuse a revision that is not on the editor's main
        if: inputs.editor_pull_request == ''
        working-directory: editor
        run: |
          git merge-base --is-ancestor "$EDITOR_REVISION" origin/main || { echo "::error::$EDITOR_REVISION is not on volter-ai/editor main"; exit 1; }

      # The job's token is read-only (contents: read) and lives in this step's env alone; nothing here installs
      # or runs a dependency.
      - name: Refuse a revision that is not the head of the named editor pull request
        if: inputs.editor_pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/volter-ai/editor/pulls/$EDITOR_PULL_REQUEST" \
            --jq '[.state, .base.ref, .head.sha, (.head.repo.full_name // "a deleted repository")] | @tsv') \
            || { echo "::error::could not read volter-ai/editor PR #$EDITOR_PULL_REQUEST"; exit 1; }
          IFS=$'\t' read -r state base head repo <<< "$pr"
          echo "volter-ai/editor PR #$EDITOR_PULL_REQUEST: $state, base $base, head $head from $repo"
          [[ "$state" == open ]] || { echo "::error::volter-ai/editor PR #$EDITOR_PULL_REQUEST is $state, not open"; exit 1; }
          [[ "$base" == main ]] || { echo "::error::volter-ai/editor PR #$EDITOR_PULL_REQUEST targets $base, not main"; exit 1; }
          [[ "$repo" == volter-ai/editor ]] || { echo "::error::volter-ai/editor PR #$EDITOR_PULL_REQUEST comes from $repo, not volter-ai/editor"; exit 1; }
          [[ "$head" == "$EDITOR_REVISION" ]] || { echo "::error::volter-ai/editor PR #$EDITOR_PULL_REQUEST head is $head, not $EDITOR_REVISION"; exit 1; }

      # The pin is read as data from git, never require()d from the tree: a FORK.json committed as a symlink to a
      # script would otherwise run as code. A symlink's blob is its target path, which fails the parse.
      - name: Read the fork pin
        id: pin
        run: |
          commit=$(git -C editor cat-file blob "$EDITOR_REVISION:packages/editor-core/workbench/FORK.json" \
            | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).commit)')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::packages/editor-core/workbench/FORK.json at $EDITOR_REVISION pins no full commit SHA"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out the fork at the pin
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.commit }}
          path: code-oss
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc

      - name: Set up node-gyp's Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require the native Apple Silicon build tools and output space
        run: |
          [[ "$(node -p 'process.platform + "-" + process.arch')" == darwin-arm64 ]] || { echo "::error::this cut requires native darwin-arm64"; exit 1; }
          xcode-select -p
          xcrun --find clang
          # This is the fresh GitHub-hosted image, never an enrolled fleet Mac.
          # The documented Android SDK is not used by this native desktop cut.
          # Resolve it to the exact known image path before a recursive removal.
          if [[ -d /Users/runner/Library/Android/sdk ]]; then
            android_sdk=$(cd /Users/runner/Library/Android/sdk && pwd -P)
            [[ "$android_sdk" == /Users/runner/Library/Android/sdk ]] || { echo "::error::the hosted Android SDK resolves outside its documented path"; exit 1; }
            sudo rm -rf -- "$android_sdk"
          fi
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')
          [[ "$free_kib" =~ ^[0-9]+$ ]] || { echo "::error::could not read the native output volume's available bytes"; exit 1; }
          (( free_kib >= 17 * 1024 * 1024 )) || { echo "::error::the native output volume has $free_kib KiB available; this cut requires 17 GiB"; exit 1; }
          mkdir -p "$WORKBENCH_ROOT"

      - name: Install the editor
        working-directory: editor
        run: |
          npm ci --ignore-scripts
          ext=node_modules/@volter/supercode-frontend-vscode/dist/extension.js
          version=$(node -p 'JSON.parse(require("fs").readFileSync("node_modules/@volter/supercode-frontend-vscode/package.json", "utf8")).version')
          sha=$(shasum -a 256 "$ext" | cut -d' ' -f1)
          echo "supercode-frontend-vscode $version, dist/extension.js $sha"
          echo "FRONTEND_VERSION=$version" >> "$GITHUB_ENV"
          echo "FRONTEND_ACTUAL_SHA256=$sha" >> "$GITHUB_ENV"
          if [[ -n "$FRONTEND_SHA256" && "$sha" != "$FRONTEND_SHA256" ]]; then
            echo "::error::dist/extension.js is $sha, expected $FRONTEND_SHA256"; exit 1
          fi

      # The fork's `npm ci` runs @vscode/ripgrep's install script, which asks GitHub's API for a release with no
      # token. From a hosted runner's shared address that is refused (403) once the address's unauthenticated
      # allowance is spent: the web workflow's run 37739234723 failed on it. The install script looks for the
      # download in a cache before it asks (lib/download.js, "Using cached download"), so this step puts the binary
      # there. It holds the read-only token in its own env and runs no dependency: the package is read as data (its
      # registry tarball, unpacked, nothing run), and the install scripts still get no token.
      - name: Fetch ripgrep's prebuilt binary to where the fork's install looks for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # What the install script asks for on this runner, and where it keeps a download: node's own tmpdir, as
          # the install script reads it, spelled with forward slashes.
          target=aarch64-apple-darwin
          extension=tar.gz
          tmp=$(node -p 'require("os").tmpdir().split("\\").join("/")')
          # Every @vscode/ripgrep version any lockfile of the fork installs, one to a line. Read into a variable, so
          # that a read that FAILS stops the step: "the lockfiles could not be read" must never pass for "no
          # lockfile installs it", which would skip the fetch and leave the cut to fail on the API as before.
          lockfiles=$(git -C code-oss ls-files -- '*package-lock.json' | wc -l | tr -d ' ') || { echo "::error::could not list the fork's lockfiles"; exit 1; }
          (( lockfiles > 0 )) || { echo "::error::the fork checkout has no package-lock.json: this is not the tree the cut installs"; exit 1; }
          found=$(git -C code-oss ls-files -z -- '*package-lock.json' | (cd code-oss && xargs -0 node -e '
            const fs = require("fs");
            const seen = new Set();
            const isMap = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            // The older lockfile shape: a tree of `dependencies`, each named by its package.
            const walk = (dependencies) => {
              for (const [name, entry] of Object.entries(dependencies)) {
                if (!isMap(entry)) continue;
                if (name === "@vscode/ripgrep" && typeof entry.version === "string") seen.add(entry.version);
                if (isMap(entry.dependencies)) walk(entry.dependencies);
              }
            };
            for (const file of process.argv.slice(1)) {
              const lock = JSON.parse(fs.readFileSync(file, "utf8"));
              // A lockfile in neither shape is one this cannot read, which must not pass for "installs none".
              if (!isMap(lock.packages) && !isMap(lock.dependencies)) throw new Error(file + " has neither a packages nor a dependencies map");
              for (const [name, entry] of Object.entries(isMap(lock.packages) ? lock.packages : {})) {
                if (name.endsWith("node_modules/@vscode/ripgrep") && isMap(entry) && typeof entry.version === "string") seen.add(entry.version);
              }
              if (isMap(lock.dependencies)) walk(lock.dependencies);
            }
            for (const version of seen) console.log(version);
          ') | tr -d '\r') || { echo "::error::could not read the fork's lockfiles for the @vscode/ripgrep versions they install"; exit 1; }
          if [[ -z "$found" ]]; then echo "none of the fork's $lockfiles lockfiles installs @vscode/ripgrep: nothing to fetch"; exit 0; fi
          # The macOS system Bash is 3.x; use read, not Bash 4 mapfile.
          while IFS= read -r version; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected @vscode/ripgrep version $version in a lockfile"; exit 1; }
            unpacked=$(mktemp -d)
            (cd "$unpacked" && npm pack "@vscode/ripgrep@$version" --ignore-scripts --silent > /dev/null && tar -xzf ./*.tgz)
            release=$(grep -oE "^const VERSION = '[^']+'" "$unpacked/package/lib/postinstall.js" | cut -d"'" -f2)
            [[ "$release" =~ ^v[0-9][0-9A-Za-z.-]*$ ]] || { echo "::error::could not read which ripgrep release @vscode/ripgrep@$version installs"; exit 1; }
            asset="ripgrep-$release-$target.$extension"
            cache="$tmp/vscode-ripgrep-cache-$version"
            mkdir -p "$cache"
            gh release download "$release" --repo microsoft/ripgrep-prebuilt --pattern "$asset" --dir "$cache" --clobber
            [[ -s "$cache/$asset" ]] || { echo "::error::$asset of microsoft/ripgrep-prebuilt $release was not downloaded"; exit 1; }
            # The binary is packaged into the retained cut, so the bytes are checked against the digest the release
            # itself lists for the asset. An asset with no listed digest is refused, not trusted.
            listed=$(gh api "repos/microsoft/ripgrep-prebuilt/releases/tags/$release" --jq ".assets[] | select(.name == \"$asset\") | .digest") \
              || { echo "::error::could not read the digest microsoft/ripgrep-prebuilt $release lists for $asset"; exit 1; }
            [[ "$listed" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::microsoft/ripgrep-prebuilt $release lists no SHA256 digest for $asset"; exit 1; }
            got=$(shasum -a 256 "$cache/$asset" | cut -d' ' -f1)
            [[ "sha256:$got" == "$listed" ]] || { rm -f "$cache/$asset"; echo "::error::$asset is $got, but the release lists ${listed#sha256:}"; exit 1; }
            echo "ripgrep $release for @vscode/ripgrep@$version: $cache/$asset ($listed)"
          done <<< "$found"

      - name: Cut the native artifact
        working-directory: editor
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: |
          node scripts/workbench/build-release.mjs --product "$PRODUCT" --platform darwin-arm64 \
            --checkout "$GITHUB_WORKSPACE/code-oss" --work "$WORKBENCH_ROOT/work" --out "$WORKBENCH_ROOT/out" --min-ram 13

      - name: Summary
        if: always()
        run: |
          {
            echo "### $PRODUCT darwin-arm64 at editor $EDITOR_REVISION"
            if [[ -n "$EDITOR_PULL_REQUEST" ]]; then
              echo "Built from volter-ai/editor PR #$EDITOR_PULL_REQUEST head $EDITOR_REVISION (unmerged at cut time)."
            fi
            echo "Chat: supercode-frontend-vscode ${FRONTEND_VERSION:-?}, dist/extension.js \`${FRONTEND_ACTUAL_SHA256:-?}\`"
            if [[ -f "$WORKBENCH_ROOT/out/BUILD.json" ]]; then
              echo "Tarball SHA256: \`$(node -p 'JSON.parse(require("fs").readFileSync(process.env.WORKBENCH_ROOT + "/out/BUILD.json", "utf8")).tarballSha256')\`"
              echo '```json'; cat "$WORKBENCH_ROOT/out/BUILD.json"; echo '```'
            else
              echo "No BUILD.json: the release was not cut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the native cut without publication
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.product }}-darwin-arm64
          path: |
            ${{ runner.temp }}/volter-workbench/out/BUILD.json
            ${{ runner.temp }}/volter-workbench/out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

